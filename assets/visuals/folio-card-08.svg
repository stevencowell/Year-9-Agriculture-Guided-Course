<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Folio card 8 — Feedlot research</title>
<desc id="desc">A Year 9 Agriculture research funnel guiding students to frame a feedlot question, find reliable sources, record evidence, synthesise findings and maintain a source register.</desc>
